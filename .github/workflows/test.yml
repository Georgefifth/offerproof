name: Prototype checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:packcheck
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e
      - run: npm run test:packcheck:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firefox-review
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: ignore
